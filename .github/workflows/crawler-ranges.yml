name: 更新搜索引擎 IP 段

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CSH_ADMIN_API_TOKEN: ${{ secrets.CSH_ADMIN_API_TOKEN }}
      CSH_API_URL: ${{ vars.CSH_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 只写运行时 KV，不提交代码，不触发 EdgeOne 构建/发布。
      - name: 写入运行时 KV
        if: env.CSH_ADMIN_API_TOKEN != ''
        run: node tools/fetch-crawler-ranges.mjs --upload --no-file
      - name: 未配置令牌时跳过
        if: env.CSH_ADMIN_API_TOKEN == ''
        run: echo "::notice::未配置 CSH_ADMIN_API_TOKEN，跳过运行时更新；继续使用仓库内置兜底 IP 段。"
