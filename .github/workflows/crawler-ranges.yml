name: 更新搜索引擎 IP 段

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 拉取 Google / Bing / Apple 官方段
        run: node tools/fetch-crawler-ranges.mjs
      - name: 有变化则提交
        run: |
          if git diff --quiet -- functions/api/crawler-ranges.js; then
            echo "IP 段无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/crawler-ranges.js
          git commit -m "chore(crawler): 更新搜索引擎 IP 段"
          git push
